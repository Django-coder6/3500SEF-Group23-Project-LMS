# Continuous integration.
# The sanity job always runs. The backend and frontend jobs are enabled in
# Sprint 2 once backend/pom.xml and frontend/package.json exist.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        env:
          HUSKY: '0'
      - name: Check commit messages in this change
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            npm run commitlint -- --from "$PR_BASE" --to "$PR_HEAD" --verbose
          elif [[ "$PUSH_BASE" =~ ^0+$ ]]; then
            git log -1 --format=%B "$PUSH_HEAD" | npm run commitlint
          else
            npm run commitlint -- --from "$PUSH_BASE" --to "$PUSH_HEAD" --verbose
          fi
      - run: npm run test:tooling

  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files and folders
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -d docs/01-requirements
          test -d docs/06-logbook
          test -d backend/src/main/java/com/group23
          echo "structure check passed"

      - name: Check that no environment file was committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::a .env file is tracked, remove it and rotate the keys"
            exit 1
          fi
          echo "no environment file tracked"

      - name: Check that every document version header matches its revision history
        run: python3 scripts/check_doc_versions.py .

      - name: Check that every markdown table row has as many cells as its header
        run: python3 scripts/check_table_columns.py .

